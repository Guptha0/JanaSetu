<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JanSetu: Citizen Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-[url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80')] bg-cover bg-center min-h-screen flex items-center justify-center font-sans py-12">
    
    <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm"></div>

    <div class="relative z-10 max-w-lg w-full glass-panel p-8 rounded-3xl shadow-2xl mx-4">
        <div class="text-center mb-8">
            <div class="inline-block bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold tracking-widest uppercase mb-4 shadow-sm border border-green-200">Global Civic e-Governance</div>
            <h1 class="text-3xl font-extrabold tracking-tight text-gray-900 mb-2">Create Global Identity</h1>
            <p class="text-gray-600 font-medium text-sm">Register to receive your unique JanSetu ID for instant login.</p>
        </div>

        <form action="/register" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-800 mb-1">Full Name</label>
                <input type="text" name="full_name" required placeholder="John Doe" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-green-100 focus:border-green-500 outline-none transition bg-white/80 text-gray-800 font-medium">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-800 mb-1">Contact Number</label>
                <input type="text" name="phone" required placeholder="+1 234 567 8900" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-green-100 focus:border-green-500 outline-none transition bg-white/80 text-gray-800 font-medium">
            </div>

            <div class="flex gap-4">
                <div class="w-1/2">
                    <label class="block text-sm font-semibold text-gray-800 mb-1">Identity Type</label>
                    <select name="id_type" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-green-100 focus:border-green-500 outline-none transition bg-white/80 text-gray-800 font-medium">
                        <option value="Aadhaar Card">Aadhaar Card</option>
                        <option value="Voter ID">Voter ID</option>
                        <option value="Passport">Passport</option>
                        <option value="National ID">Other National ID</option>
                        <option value="Student ID">Student ID</option>
                    </select>
                </div>
                <div class="w-1/2">
                    <label class="block text-sm font-semibold text-gray-800 mb-1">ID Number</label>
                    <input type="text" name="id_number" required placeholder="A1234567" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-green-100 focus:border-green-500 outline-none transition bg-white/80 text-gray-800 font-mono text-sm">
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-green-600 text-white font-bold rounded-xl hover:bg-green-700 transition shadow-lg shadow-green-600/30 mt-6 flex items-center justify-center">
                Generate JanSetu ID &rarr;
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-gray-200/50 text-center">
            <a href="/login" class="text-sm text-blue-600 font-bold hover:underline">Already have an ID? Login here.</a>
        </div>
    </div>
</body>
</html>
